<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shiny App</title>
    <script
      src="./../shinylive/load-shinylive-sw.js"
      type="module"
    ></script>
    <script type="module">
      import { runExportedApp } from "./../shinylive/shinylive.js";
      runExportedApp({
        id: "root",
        appEngine: "r",
        relPath: "../",
      });
    </script>
    <link rel="stylesheet" href="./../shinylive/style-resets.css" />
    <link rel="stylesheet" href="./../shinylive/shinylive.css" />
    <style>
#load-note { display: none; position: fixed; z-index: 1; left: 50%; top: calc(50vh - 4rem); transform: translate(-50%, -100%);
  width: max-content; max-width: min(40rem, 90vw); margin: 0; text-align: center; color: #9a9a9a;
  font: 0.6rem/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
body:has(.loading-status) #load-note { display: block; animation: loading-animation-fade-in 1s; }
html.dm-dark { color-scheme: dark; }
html.dm-dark body { background-color: #222; color: #fff; }
html.dm-dark .shinylive-viewer .loading-wrapper,
html.dm-dark .shinylive-viewer iframe { background-color: #222; }
html.dm-dark .loading-animation { --animation-start-color: #252525; --animation-end-color: #434343; }
html.dm-dark .loading-status .loading-stage,
html.dm-dark #load-note { color: #8c8c8c; }
html.dm-dark .shinylive-viewer .loading-wrapper .error-alert .error-recovery { background-color: #58342e; color: #fff; }
html.dm-dark .shinylive-viewer .loading-wrapper .error-alert .error-recovery-lead { color: #fff; }
html.dm-dark .shinylive-viewer .loading-wrapper .error-alert .error-recovery kbd { background-color: #222; color: #fff; }
</style>
<script>
// Dark mode (darkmode/darkmode.md, Phase 4): shinylive's loading page, shown while webR
// starts, follows the book's choice (same key and values as the book and the apps).
// Added by export-apps.R through shinylive::export(template_params = ).
(function () {
  var s = null;
  try { s = localStorage.getItem("quarto-color-scheme"); } catch (e) {}
  if (s === "alternate" || (s === null && window.matchMedia("(prefers-color-scheme: dark)").matches))
    document.documentElement.classList.add("dm-dark");
})();
</script>
<style>
#yay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; pointer-events: none; z-index: 2000; }
#yay i { position: absolute; display: block; opacity: 0; animation: yay var(--t) var(--w) 1 both; will-change: transform; }
@keyframes yay {
  0% { opacity: 0; transform: translate(0, 0) rotate3d(1, 0.6, 0, 0deg); animation-timing-function: cubic-bezier(0.12, 0.75, 0.35, 1); }
  2% { opacity: 1; }
  28% { transform: translate(var(--x), var(--y)) rotate3d(1, 0.6, 0, calc(var(--r) * 0.35)); animation-timing-function: cubic-bezier(0.35, 0.1, 0.8, 0.8); }
  88% { opacity: 1; }
  100% { opacity: 0; transform: translate(calc(var(--x) * 1.4), var(--h)) rotate3d(1, 0.6, 0, var(--r)); }
}
#yay.m i { animation: yay var(--t) var(--w) 1 both, sh var(--f) var(--g) infinite alternate ease-in-out; will-change: transform, filter; }
@keyframes sh { from { filter: brightness(0.62); } to { filter: brightness(var(--b)); } }
</style>
<script>
function yay(x) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches || document.getElementById('yay')) return;
  var w = innerWidth, h = innerHeight, y = 0.7 * h, s = '', d = document.createElement('div');
  var m = {silver: ['#474e55', '#98a1a9', '#eef1f4', 1.25], gold: ['#8f6400', '#e5b000', '#fff0a3', 1.75]}[x];
  var c = ['#4393c3', '#d6604d', '#009670', '#e0a030'];
  var r = function(a, b) { return a + Math.random() * (b - a); };
  for (var i = 0; i < 130; i++) {
    var a = r(-0.92, -0.08) * Math.PI, v = r(0.22, 0.825) * Math.min(w, h);
    s += '<i style="left:' + (w / 2).toFixed(0) + 'px;top:' + y.toFixed(0) + 'px;width:' + r(6, 9).toFixed(1) + 'px;height:' + r(9, 14).toFixed(1) +
      'px;--b:' + (m ? m[3] : 1) + ';background:' + (m ? 'linear-gradient(' + r(0, 180).toFixed(0) + 'deg,' + m[0] + ',' + m[1] + ' 35%,' + m[2] + ' 50%,' + m[1] + ' 65%,' + m[0] + ')' : c[i % 4]) + ';' + (i % 5 ? '' : 'border-radius:50%;') +
      '--x:' + (Math.cos(a) * v * 1.4).toFixed(0) + 'px;--y:' + (Math.sin(a) * v).toFixed(0) + 'px;--h:' + (h - y + 30).toFixed(0) + 'px;' +
      '--r:' + r(360, 1080).toFixed(0) + 'deg;--t:' + r(2.2, 3.6).toFixed(2) + 's;--w:' + r(0, 0.12).toFixed(2) + 's;--f:' + r(0.14, 0.42).toFixed(2) + 's;--g:-' + r(0, 0.4).toFixed(2) + 's"></i>';
  }
  d.id = 'yay';
  if (m) d.className = 'm';
  d.setAttribute('aria-hidden', 'true');
  d.innerHTML = s;
  document.body.appendChild(d);
  setTimeout(function() { d.remove(); }, 4000);
}
</script>
  </head>
  <body>
    <p id="load-note">The first time you open this app, your browser downloads R and the packages it needs (~50 MB).<br>This can take <b>a minute or more</b> on a slow connection. Later visits start faster.</p>
<script>
// Prefetching of the apps' files (apps-src/README.md, "Prefetching").
(function () {
  function go(u, pr) {
    fetch(u).then(function (r) { return r.json(); }).then(function (f) {
      var i = 0;
      function next() {
        if (i >= f.length) return;
        fetch(new URL(f[i++], u), { priority: pr }).then(function (r) {
          var d = r.body.getReader();
          return (function pump() { return d.read().then(function (c) { if (!c.done) return pump(); }); })();
        }).catch(function () {}).then(next);
      }
      next(); next(); next();
    }).catch(function () {});
  }
  try {
    if (/\/apps\/[^\/]+\/(index\.html)?$/.test(location.pathname)) {
      if (navigator.userAgentData) go(new URL("../prefetch.json", location.href), "auto");
      return;
    }
    var a = Array.prototype.find.call(document.querySelectorAll("a[href]"), function (x) {
      return x.origin === location.origin && /\/apps\/[^\/]+\/$/.test(x.pathname);
    });
    if (!a || !matchMedia("(pointer: fine)").matches || (navigator.connection && navigator.connection.saveData)) return;
    var u = new URL("../prefetch.json", a.href);
    var t = function () { setTimeout(function () { go(u, "low"); }, 30000); };
    if (document.readyState === "complete") t(); else addEventListener("load", t);
  } catch (e) {}
})();
</script>
    <div style="height: 100vh; width: 100vw" id="root"></div>
    
  </body>
</html>
